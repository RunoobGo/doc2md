# Doc2md 部署样例配置（上游 C-1 基线 + 本仓库实现增量；逐键语义见方案 附录 A）
# 复制为项目根 doc2md.toml，或 $DOC2MD_HOME/doc2md.toml。
# 全部键均有内置默认值（doc2md/config/default_toml.py），本文件列全默认键集
# （CH-456 收敛 D-10：示例与默认值不再有键集差），只改需要按部署改写的项。

[paths]
root = "work"                          # 相对路径会随 root 一起迁移（CH-432）；--root 可覆盖
out = "work/out"
reports = "work/reports"
logs = "work/logs"
tmp = "work/tmp"
vendor_models = "vendor/models/llm"    # 本地模型资产根（相对 paths.root；默认即 work/vendor/models/llm）

[run]
profile = "standard"                   # lite / standard / strict 三档（方案 1.2 冻结契约 + 第七章）
                                       # lite：chunk 16 / workers 1 / queue_async true
                                       # strict：queue_async true / min_free_mb 2048
                                       # 用户显式配置的键永远赢过 profile（CH-456）
offline_assert = true                  # NFR-1：转换期出站连接即抛 OfflineViolation（回环除外）

[s1]
chunk_pages = 32                       # CH-447：分块解析驻留上限（0 = 整本一次读完）
                                       # 8GB Win11 / 16GB Mac mini 建议 32；320 页样本
                                       # 峰值驻留实测 1025MB → 177MB
legacy_doc_backend = "auto"            # CH-487：.doc → .docx（auto/libreoffice/word/none）
legacy_doc_timeout_s = 120             # 外部转换超时；超时按 E4151 拒收

[s1_5]
sample_pages = "auto"                  # even5 = 上游原口径；auto 为判定增强（CH-424，方案 第十一章）
min_chars_per_page = 120
reject_on_any_bad_page = true
page_detail_in_report = true

[s2]
mode = "auto"                          # auto / single / two_phase（方案 4.3）
max_pages_per_shard = 300
shard_overlap_pages = 2
dedupe_overlap = true

[s4]
preserve_marks_strike = false          # CH-417：删除线默认关，开启才输出 ~~
link_internal = "plain"                # CH-416：PDF goto / DOCX 书签链接降级为普通文本

[perf]
workers = 0                            # CH-448：批量转换进程数；0 = 自动 min(4, CPU)
                                       # 8GB 内存机器别调到 8：驻留 ≈ workers × chunk_pages
queue_batch_factor = 4                 # CH-476（R7-PERF-1）：每轮领取量 = workers × 该系数
                                       # 摊薄「每轮新建进程池 + worker 重导」的固定开销；
                                       # 1 = 旧口径（按池取件）。并发仍受 workers 约束
queue_async = false                    # CH-449：true → POST /jobs 只入队，由 `doc2md work` 消费
enqueue_hash_threads = 8               # CH-476（R7-PERF-3）：异步入队的「预检+内容哈希」线程上限
                                       # 1 = 逐个串行；写库始终单线程按序提交，附着/幂等口径不变
sync_min_parallel = 8                  # CH-471（SVC-3）：同步目录达此文件数才走进程池；否则串行
                                       # 1 = 全部串行（同步转换仍是默认路径，方案 5.4）
min_free_mb = 512                      # CH-450（NFR-6）：写产物/备份前的剩余空间下限；本项与 disk_safety_factor 同时为 0 才关闭门禁
disk_safety_factor = 3                 # 需求 = 源大小 × 该系数
stale_job_minutes = 30                 # CH-448：`doc2md work` 回收 running 超过该时长且崩溃遗骸（仅限队列来源）
stale_check_seconds = 60               # CH-469：常驻 work 进程重跑遗骸回收的节流周期；0 = 只启动时回收一次
batch_file_timeout_s = 0               # CH-469：批量进程池内单文件墙钟上限；0 = 不设限
                                       # >0 时损坏 PDF 让 pdfplumber 挂死也只拖这一件（超时记 E5000 并取消）

[watch]
stable_seconds = 5                     # CH-411：大小 + mtime 连续 5s 无变化才入队
follow_symlinks = false
max_depth = 20
skip_hidden = true
max_files_per_dir = 5000               # 超限 413 / E4133（CH-410）

[api]
bind = "127.0.0.1"                     # 离线单机：只回环，不对外
port = 8090
allow_remote_bind = false              # CH-471 SVC-5：非回环 bind 默认被 config.validate 拒绝
token_roles = ["admin", "editor", "reader"]
revoke_effective_seconds = 5
base_revision_required = true          # false = 乐观锁灰度 optional 阶段

[logs]
rotate_mb = 50                         # CH-413：≥50MB 或跨 UTC 日轮转，保留 5 份
rotate_keep = 5

[ops]
events_retention_days = 30
tasks_retention_days = 30              # CH-471（SVC-4）：终态作业保留期，防 tasks 无界增长
backup_local_dir = "work/reports/backups"
backup_external_dir = ""               # 外置卷路径；留空 = 未配置，周报按配置跳过（CH-433）
backup_external_encrypted = true       # NFR-18：false 会被拒绝执行（PermissionError）
backup_rotation_days = 14              # FR-128：已删数据 ≤14 天从全部副本轮出
work_dir_mode = "700"                  # CH-437：work/ 权限由备份路径实际落实

[llm]
mode = "offline"                       # CH-456 / T2：offline = 确定性占位（默认，主链路零网络）
                                       # server = 本地 llama-server（仅 127.0.0.1）
fallback = true                        # server 不可用时回退 offline，保持主链路；false = 明确 E5041/503
timeout_ms = 15000                     # 单次请求超时（连接 + 读取合计）
retries = 2                            # CH-469：仅连接类瞬断（URLError/超时/OSError）重试次数，
                                       # 0 = 不重试；HTTP 状态类错误不重试，用完即降级/报错
model = ""                             # 模型名；空 = 取 [paths].vendor_models 下发现的 gguf 文件名
bind = "127.0.0.1"                     # 修补助手只连回环（NFR-1）；T2 起生效
port = 8080
auth = false                           # CH-408：已知接受项——llama-server 本机无鉴权；
                                       # true 时口令走 DOC2MD_LLM_TOKEN 环境变量（Bearer），不落配置
op_whitelist = ["split_block", "merge_block", "fix_heading_level",
                "fix_list_marker", "mark_table_boundary"]

[security]
max_name_bytes = 128                   # FR-127：消毒后文件名字节预算
sanitize_fail_action = "reject"        # 冻结键：唯一合法值 reject（消毒失败即拒收，不设降级）

[chunks]
tokenizer = "gguf-embedded"            # CH-402：vocab 从生产 GGUF 导出
manifest = "vendor/models/llm/tokenizer.manifest.json"
