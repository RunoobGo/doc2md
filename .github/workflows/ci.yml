name: ci

# 方案 8.6：6 条红线断言进 CI（merge-gate），失败即 CI 红并在 CI 内阻断 full-suite；
# 平台级「必需检查」已于 CH-468 配置为 merge-gate 三档（PR 路径阻断；直推 main 仍可绕过，
# 见 CH-470，所以 ops/hooks/pre-push 保留）。
# 分层口径：merge-gate 只跑 `-m gate`（红线，阻断合并）；全量 + 可复现性作为信息面。
# CH-456（方案 T10）：ruff 静态检查为独立信息作业，与 merge-gate 并行、不互相 needs——
# 风格判断不得变成红线，也不得拖慢红线层。
# CH-471（本轮）：三个作业都加 `timeout-minutes`。缺它时一次挂死会占满 GitHub 的 6 小时
# 默认上限——红线在几小时内既不是绿也不是红，等于没有红线；现在最坏 6/10/30 分钟必出结论。
# CH-471（merge-gate 超时右调）：原 15 分钟过宽。实测 6 轮成功 CI 的 18 条 merge-gate leg
# 样本：中位 ~83s、观察到的最慢 2m40s（含 checkout + pip 安装与两次 320 页转换 session
# fixture），故降到 6 分钟——≈最慢样本的 2.2 倍，仍留冷缓存/慢 runner 余量，同时把挂死时
# 的空耗从 15 分钟砍到 6（full-suite 的 needs 也就更早拿到结论）。
# 同时 gate 与 full-suite 改用 `-vv`（`pytest.ini` 的 addopts 已含 `-q`，净 verbosity
# = -1 + 1 = 0，单 `-v` 在 CI 里打不出逐用例行；`-vv` 每行一个用例名，267/827 行的日志
# 代价可忽略）：挂死发生时「最后一条 PASSED 之后的下一个用例」就是嫌疑人，作业超时无需再猜。
# CH-479（版本矩阵口径）：本文件是 **push 面**，`full-suite` 刻意保持 3.12 单档——跨版本
# 全量在 `ci-full-matrix.yml` 的周度腿（周一 02:17 UTC + workflow_dispatch）里跑。理由与
# 分工见方案 8.6；该口径由 `tests/test_ch479_ci_matrix.py` 四条红线钉住——给本文件的
# `full-suite` 加矩阵、或给周期腿挂 `push` 触发，都会在 merge-gate 里直接判红。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6        # CH-471：实测最慢 leg 2m40s，6min 留 >2x 余量（见文件头口径）
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: six merge-gates (red line)
        run: python -m pytest -m gate -vv --durations=10

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff (F/E/I hygiene, informational)
        # CH-471（TEST-5a）：显式 continue-on-error——「信息面」不应仅靠分支保护不引用它
        # 来成立；原写法红 lint 仍会把整个工作流染红。风格判断不入红线（CH-456）。
        continue-on-error: true
        run: ruff check .

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: merge-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: python -m pytest -vv --durations=15
      - name: Golden assets byte-reproducible (CH-442)
        run: python -m pytest -q tests/test_golden_repro.py
      - name: doctor self-check (CH-441 dep single source)
        run: |
          doc2md doctor
          doc2md --version
