name: ci

# 方案 8.6：6 条红线断言进 CI（merge-gate），失败即 CI 红并在 CI 内阻断 full-suite；
# 平台级「必需检查」受 T1 阻碍未配置（README CI 节）。
# 分层口径：merge-gate 只跑 `-m gate`（红线，阻断合并）；全量 + 可复现性作为信息面。
# CH-456（方案 T10）：ruff 静态检查为独立信息作业，与 merge-gate 并行、不互相 needs——
# 风格判断不得变成红线，也不得拖慢红线层。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: six merge-gates (red line)
        run: python -m pytest -m gate -q --durations=10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff (F/E/I hygiene, informational)
        run: ruff check .

  full-suite:
    runs-on: ubuntu-latest
    needs: merge-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full test suite
        run: python -m pytest -q --durations=15
      - name: Golden assets byte-reproducible (CH-442)
        run: python -m pytest -q tests/test_golden_repro.py
      - name: doctor self-check (CH-441 dep single source)
        run: |
          doc2md doctor
          doc2md --version
