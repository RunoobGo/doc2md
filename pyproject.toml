[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md"
version = "2.10.0"
description = "文本型 PDF / DOCX → Markdown 离线转换管线（Doc2md）"
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Office/Business :: Office Suites",
]
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "cryptography>=42",
  "Flask>=3",
]

[project.optional-dependencies]
# 测试与黄金样本生成（tests/make_golden.py 用 reportlab 造 PDF、pypdf 数页数）
# CH-456：ruff 为静态检查工具链（方案 T10），只进 CI 独立信息步骤，不进红线
dev = ["pytest>=8", "reportlab>=4", "pypdf>=4", "ruff>=0.8"]

[project.scripts]
doc2md = "doc2md.cli:main"

[tool.setuptools.packages.find]
include = ["doc2md*"]

# CH-456（方案 T10）：静态检查工具链。口径 = F（pyflakes：未使用导入/未定义名等）
# + E（pycodestyle 错误类）+ I（import 排序）；E501 行宽属项目既有风格（中文长行），
# 另行管理不计入。该检查进 CI 独立信息步骤，**不进 merge-gate**——风格判断不得成为红线。
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试与样本生成器允许长行与紧凑写法（黄金样本逐字节复现优先于风格）
"tests/*" = ["E741"]

[tool.setuptools.package-data]
# CH-441：删去不存在的 prompts/*.md  glob（本仓库无该目录，声明只会在打包日志里挂空条目）
doc2md = ["static/*"]
