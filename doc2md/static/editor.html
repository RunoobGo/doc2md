<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Doc2md 审阅编辑器（M9a 最小前端 + T4 队列可视化 + G4' 回滚）</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; padding: 16px; max-width: 1080px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  input, button, select { font: inherit; padding: 4px 8px; }
  input[type=text] { min-width: 180px; }
  .blk { border: 1px solid #8884; border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .meta { font-size: 12px; opacity: .75; display: flex; gap: 10px; flex-wrap: wrap; }
  textarea { width: 100%; box-sizing: border-box; min-height: 54px; font: inherit; }
  .edge { border-color: #e08a00; }
  .hit  { background: #ffe9a8; color: #000; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px;
         border-top: 1px dashed #8886; margin-top: 12px; padding-top: 8px; }
  .warn { color: #c0392b; }
  /* --- T4 队列面板 ------------------------------------------------------- */
  #queue { border: 1px solid #8884; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid #8886; border-radius: 999px; padding: 1px 10px; font-size: 12px;
          cursor: pointer; background: transparent; }
  .chip[aria-pressed="true"] { outline: 2px solid currentColor; font-weight: 600; }
  .chip b { font-variant-numeric: tabular-nums; }
  .c-queued   { color: #6b7280; }
  .c-running  { color: #1d4ed8; }
  .c-done     { color: #047857; }
  .c-failed   { color: #b91c1c; }
  .c-rejected { color: #b45309; }
  #qtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #qtable th, #qtable td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #8882;
                           vertical-align: top; }
  #qtable th { font-size: 12px; opacity: .75; white-space: nowrap; }
  #qtable td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #qtable tr.st-failed   { background: #b91c1c14; }
  #qtable tr.st-rejected { background: #b4530914; }
  #qtable tr.st-running  { background: #1d4ed810; }
  #qtable .st { font-weight: 600; white-space: nowrap; }
  #qtable .reason { max-width: 34em; overflow-wrap: anywhere; }
  #qtable .job { font-family: ui-monospace, monospace; font-size: 11.5px; }
  #qtable button.link { background: none; border: none; padding: 0; color: #1d4ed8;
                        cursor: pointer; text-decoration: underline; font-size: inherit; }
  #qstamp { font-size: 12px; opacity: .6; }
  #qempty { font-size: 12.5px; opacity: .7; padding: 6px 0; }
  /* --- G4'（FR-211）块历史 / 回滚 ---------------------------------------- */
  .hist { border-top: 1px dashed #8886; margin-top: 8px; padding-top: 6px; font-size: 12.5px; }
  .histrow { border-bottom: 1px solid #8882; padding: 4px 0; }
  .histrow:last-child { border-bottom: none; }
  .histprev { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11.5px;
              opacity: .85; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .histrow button { font-size: 12px; padding: 2px 8px; }
</style>
</head>
<body>
<h1>Doc2md 审阅编辑器 · M9a（revision 锁定与重取） · T4（队列可视化） · G4'（历史与回滚）</h1>

<section id="queue">
  <div class="bar">
    <strong>转换队列</strong>
    <span id="qcounts" class="chips"></span>
    <label><input type="checkbox" id="qauto" checked>自动刷新 5s</label>
    <button id="qrefresh">刷新</button>
    <span id="qstamp"></span>
  </div>
  <table id="qtable">
    <thead><tr>
      <th>任务</th><th>文件</th><th>状态</th><th>档位</th>
      <th>排队等待</th><th>耗时</th><th>错误码</th><th>失败原因</th>
    </tr></thead>
    <tbody id="qrows"></tbody>
  </table>
  <div id="qempty" hidden>暂无任务。通过 <code>doc2md work --enqueue &lt;路径&gt;</code> 或
    <code>POST /jobs</code> 入队后，这里显示进度与失败原因（只含元数据，不含正文，NFR-20）。</div>
</section>

<div class="bar">
  <label>Token <input type="text" id="tok" size="34" placeholder="doc2md serve token --role editor"></label>
  <label>doc_id <input type="text" id="doc" size="20"></label>
  <button id="load">载入</button>
  <label>搜索 <input type="text" id="q" size="16"></label>
  <button id="go">检索</button>
  <button id="goMore" disabled>更多命中</button>
  <label><input type="checkbox" id="onlyEdge">只看分片边界块</label>
</div>

<div id="blocks"></div>
<div class="bar" id="morebar" hidden>
  <button id="more">加载更多块</button><span id="moreinfo" class="meta"></span>
</div>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const locked = new Map();          // block_id -> 载入时锁定的 base_revision

function log(msg, bad) {
  const el = $("log");
  el.textContent = `[${new Date().toISOString().slice(11,19)}] ${msg}\n` + el.textContent;
  el.classList.toggle("warn", !!bad);
}

async function api(path, opt) {
  const r = await fetch(path, Object.assign({ headers: {
    "X-Doc2md-Token": $("tok").value.trim(),
    "Content-Type": "application/json" } }, opt || {}));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || `${r.status}`); e.body = j; e.status = r.status; throw e; }
  return j;
}

// --- T4：队列可视化 ---------------------------------------------------------
// 数据面：GET /jobs（CH-449，只回计数与任务元数据，NFR-20 不含正文）。
// 渲染面：状态计数 chips（点击过滤，过滤态经 `?status=` 由服务端判定）+ 任务表
// （排队等待 / 耗时 / 错误码 / 失败原因），「卡在哪一步」= 状态机阶段 + 时间差，
// 无需翻日志。chip 计数是全库口径，任务表只回 `limit` 条窗口——两者别混为一谈。
// 「转换中」= **已认领**：`claim` 一轮取 workers × [perf].queue_batch_factor（默认 4）
// 件并全部置 running（CH-476 / R7-PERF-1），故它可以大于 `--workers`，
// 且 running 行的「耗时」从认领起算，不是真正开跑的时刻。
const QSTAGES = { queued: "排队中", running: "转换中", done: "完成",
                  failed: "失败", rejected: "拒绝" };
const QORDER = ["queued", "running", "failed", "rejected", "done"];
const QSTATE = { filter: "", tasks: [], seenBad: new Set(), timer: null, truncNoted: false };

function fmtDur(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return "-";
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m" + String(s % 60).padStart(2, "0") + "s";
  const h = Math.floor(m / 60);
  return h + "h" + String(m % 60).padStart(2, "0") + "m";
}

function qStageCell(t, now) {
  const created = Date.parse(t.created_at);
  const started = Date.parse(t.started_at || "") || null;
  const finished = Date.parse(t.finished_at || "") || null;
  let wait = "-", dur = "-";
  if (t.status === "queued") wait = fmtDur(now - created);
  else if (t.status === "running") { wait = fmtDur(started - created); dur = fmtDur(now - started); }
  else if (finished) { wait = fmtDur(started ? started - created : finished - created);
                       dur = fmtDur(finished - created); }
  return { wait, dur };
}

function renderCounts(counts) {
  const el = $("qcounts");
  el.innerHTML = "";
  QORDER.forEach(st => {
    const n = counts[st] || 0;
    const b = document.createElement("button");
    b.className = "chip c-" + st;
    b.setAttribute("aria-pressed", String(QSTATE.filter === st));
    b.title = QSTAGES[st] + "（点击过滤）";
    b.innerHTML = `${QSTAGES[st]} <b>${n}</b>`;
    b.onclick = () => {
      QSTATE.filter = (QSTATE.filter === st ? "" : st);
      // CH-498 / B-11 走查：过滤必须走服务端 `?status=`。`GET /jobs` 只回最近
      // `limit` 条（created_at DESC），本地过滤在窗口截断时会「计数非 0、表格全空」
      // 并弹出「暂无任务」的假提示。
      loadQueue();
    };
    el.appendChild(b);
  });
}

function renderQueue(tasks) {
  const now = Date.now();
  const body = $("qrows");
  body.innerHTML = "";
  const shown = tasks.filter(t => !QSTATE.filter || t.status === QSTATE.filter);
  $("qempty").hidden = shown.length > 0;
  shown.forEach(t => {
    const det = t.detail || {};
    // NFR-20：只渲染元数据（错误码 / 原因文本 / 块数计数），绝不渲染文档正文
    const reason = String(det.reason || "").slice(0, 120);
    const file = String(t.source_path || "").split(/[\\/]/).pop() || "-";
    const { wait, dur } = qStageCell(t, now);
    // CH-469（V-11）：单元格结构在 JS 侧判定（原来拼出 HTML 串再用
    // `docCell !== "-"` 反推，doc_id 转义后恰为 "-" 时结构就错了），
    // 所有插值一律 esc()——job_id / doc_id / source_path / error_code / reason
    // 都是源文档与队列输入派生的字符串。
    const docCell = (t.status === "done" && t.doc_id)
      ? `<button class="link" data-doc="${esc(t.doc_id)}">${esc(t.doc_id)}</button>`
      : esc(t.doc_id || "-");
    const blocks = (t.status === "done" && typeof det.blocks === "number")
      ? ` · ${det.blocks} 块` : "";
    const tr = document.createElement("tr");
    tr.className = "st-" + t.status;
    tr.innerHTML =
      `<td class="job" title="${esc(t.job_id)}">${esc((t.job_id || "").slice(0, 8))}<br>${docCell}</td>` +
      `<td title="${esc(t.source_path || "")}">${esc(file)}</td>` +
      `<td><span class="st c-${esc(t.status)}">${QSTAGES[t.status] || esc(t.status)}</span>${blocks}</td>` +
      `<td>${esc(t.mode || "standard")}</td>` +
      `<td class="num">${wait}</td><td class="num">${dur}</td>` +
      `<td class="job">${esc(t.error_code || "")}</td>` +
      `<td class="reason">${esc(reason)}</td>`;
    const docBtn = tr.querySelector("button[data-doc]");
    if (docBtn) docBtn.onclick = () => { $("doc").value = docBtn.dataset.doc; load(); };
    body.appendChild(tr);
  });
  $("qstamp").textContent = `更新于 ${new Date().toLocaleTimeString()} · 共 ${tasks.length} 条` +
    (QSTATE.filter ? ` · 过滤：${QSTAGES[QSTATE.filter]}` : "");
}

async function loadQueue() {
  if (!$("tok").value.trim()) {           // 未填 Token：不刷错误，等填了再拉
    $("qstamp").textContent = "填入 Token 后自动加载队列";
    return;
  }
  let j;
  try { j = await api("/jobs?limit=50" +
                     (QSTATE.filter ? "&status=" + encodeURIComponent(QSTATE.filter) : "")); }
  catch (e) { return log(`队列拉取失败：${e.message}`, true); }
  QSTATE.tasks = j.tasks || [];
  renderCounts(j.counts || {});
  renderQueue(QSTATE.tasks);
  // CH-500（R17-API-8）：`/jobs` 现在回 `total`/`has_more`——面板不得再把「最新 50 条」
  // 显示成全部。提示只做一次（5s 自刷不能刷屏），恢复未截断时重新武装。
  if (j.has_more && !QSTATE.truncNoted) {
    QSTATE.truncNoted = true;
    log(`队列仅显示最新 ${(j.tasks || []).length} / ${j.total} 条` +
        "（服务端按 created_at DESC 截断；点状态 chip 走服务端过滤，或 doc2md work 清队列）", true);
  }
  if (!j.has_more) QSTATE.truncNoted = false;
  QSTATE.tasks.forEach(t => {
    if ((t.status === "failed" || t.status === "rejected") && !QSTATE.seenBad.has(t.job_id)) {
      QSTATE.seenBad.add(t.job_id);
      const det = t.detail || {};
      log(`队列告警：${t.job_id.slice(0, 8)} ${QSTAGES[t.status]} ` +
          `${t.error_code || ""} ${String(det.reason || "").slice(0, 120)}`, true);
    }
  });
}

function qAutoToggle() {
  if ($("qauto").checked && !QSTATE.timer) QSTATE.timer = setInterval(loadQueue, 5000);
  if (!$("qauto").checked && QSTATE.timer) { clearInterval(QSTATE.timer); QSTATE.timer = null; }
}

const PAGE = 200;                  // 首屏块窗口（CH-469 / V-5：数千块文档不再一次拉全量）
const VIEW = { doc: "", next: 0, total: 0 };
const SRCH = { q: "", offset: 0, limit: 0 };   // CH-500 / R17-API-7：检索翻页游标

const fetchWindow = (d, offset, limit = PAGE) =>
  api(`/docs/${encodeURIComponent(d)}?offset=${offset}&limit=${limit}`);

async function load() {
  const d = $("doc").value.trim();
  if (!d) return log("先填 doc_id", true);
  let j;
  try { j = await fetchWindow(d, 0); }
  catch (e) { return log(`载入失败：${e.message}`, true); }
  VIEW.doc = d;
  VIEW.total = typeof j.blocks_total === "number" ? j.blocks_total : j.blocks.length;
  VIEW.next = j.blocks.length;
  locked.clear();
  $("blocks").innerHTML = "";
  renderBlocks(j.blocks);
  showMore();
  log(`载入 ${VIEW.next}/${VIEW.total} 块（sharded=${!!j.sharded}，pages=${j.pages}）`);
}

async function loadMore() {
  if (VIEW.next >= VIEW.total) return;
  let j;
  try { j = await fetchWindow(VIEW.doc, VIEW.next); }
  catch (e) { return log(`追加载入失败：${e.message}`, true); }
  if (!j.blocks.length) { VIEW.next = VIEW.total; return showMore(); }
  renderBlocks(j.blocks);
  VIEW.next += j.blocks.length;
  showMore();
  log(`已加载 ${VIEW.next}/${VIEW.total} 块`);
}

function showMore() {
  const left = VIEW.total - VIEW.next;
  $("morebar").hidden = left <= 0;
  $("moreinfo").textContent = left > 0 ? `还有 ${left} 块未载入` : "";
}

function renderBlocks(list) {
  list.forEach(b => {
    locked.set(b.id, b.revision);
    const div = document.createElement("div");
    div.className = "blk" + (b.flags && b.flags.shard_edge ? " edge" : "");
    div.dataset.bid = b.id;
    // CH-469（V-11）：块 id / 类型 / 吸收标记全部来自源文档（docx 的 w:id、PDF 的
    // 结构推断），是**不可信输入**；原实现把它们裸插进 innerHTML，构造文档即可在
    // 审阅页执行脚本。现在所有插值一律过 esc()（连 textarea 里的正文同口径）。
    const absorbed = (b.flags && Array.isArray(b.flags.absorbed_ids))
      ? b.flags.absorbed_ids.map(esc).join(",") : "";
    div.innerHTML =
      `<div class="meta"><b>${esc(b.id)}</b><span>${esc(b.type)}` +
      (b.level ? " h" + esc(String(b.level)) : "") + "</span>" +
      `<span>p.${b.page == null ? "-" : esc(String(b.page))}</span>` +
      `<span data-rev>rev ${esc(String(b.revision))}</span>` +
      (absorbed ? `<span title="缝合吸收">吸收 ${absorbed}</span>` : "") +
      (b.immutable ? "<span>immutable</span>" : "") + "</div>" +
      `<textarea ${b.immutable ? "disabled" : ""}>${esc(b.text || "")}</textarea>` +
      `<div class="meta"><button data-act="save">保存</button>` +
      `<button data-act="refresh">重取</button><button data-act="audit">审计</button>` +
      `<button data-act="history">历史</button></div>` +
      `<div class="hist" data-hist hidden></div>`;
    $("blocks").appendChild(div);
  });
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// CH-469（V-11）：块 id 不再拼进 CSS 属性选择器（含引号的 id 会改写选择器）。
// 改为按 dataset.bid 精确比对——赋值不经解析，天然安全。
const blkEl = (bid) => [...document.querySelectorAll(".blk")].find(el => el.dataset.bid === bid);

async function save(bid) {
  const el = blkEl(bid);
  if (!el) return log(`${bid} 不在已加载窗口内`, true);
  const ta = el.querySelector("textarea");
  const base = locked.get(bid);                  // 打开时锁定的 revision（FR-203）
  try {
    const r = await api(`/docs/${encodeURIComponent(VIEW.doc)}/blocks/${encodeURIComponent(bid)}`, {
      method: "PATCH",
      body: JSON.stringify({ text: ta.value, base_revision: base })
    });
    locked.set(bid, r.revision);
    log(`${bid} 保存成功 → rev ${r.revision}（搜索索引已同步刷新，CH-418）`);
    await refetch(bid);
  } catch (e) {
    if (e.status === 425) {                      // 冲突 → 重取后再编辑，不覆盖他人改动
      const cur = e.body.detail && e.body.detail.current_revision;
      log(`${bid} 冲突 E4251：服务端 rev=${cur}。已重取最新内容，请核对后再保存。`, true);
      await refetch(bid, cur);
    } else log(`${bid} 失败：${e.message}`, true);
  }
}

async function refetch(bid, rev) {
  const el = blkEl(bid);
  if (!el) return;
  // CH-469（V-5）：渲染顺序即服务端 rowid 顺序，DOM 下标就是该块的 offset →
  // 只取它一行（原实现为了一块把整篇文档再拉一遍）。
  const idx = [...document.querySelectorAll(".blk")].indexOf(el);
  let j;
  try { j = await fetchWindow(VIEW.doc, idx, 1); }
  catch (e) { return log(`${bid} 重取失败：${e.message}`, true); }
  const b = j.blocks.find(x => x.id === bid);
  if (!b) return;
  if (rev === undefined) rev = b.revision;
  locked.set(bid, rev);
  el.querySelector("textarea").value = b.text || "";
  const revEl = el.querySelector("[data-rev]");
  if (revEl) revEl.textContent = `rev ${rev}`;
  log(`${bid} 已重取（本地锁定 rev=${rev}）`);
}

async function showAudit(bid) {
  // CH-495（R14-GUI-4）：api() 抛错（401/403/网络）时原实现是未捕获 rejection——
  // 用户点了「审计」毫无反馈。与 load()/save() 同口径：错误进 log 条。
  let j;
  try { j = await api(`/docs/${encodeURIComponent(VIEW.doc)}/audit?block_id=${encodeURIComponent(bid)}&limit=20`); }
  catch (e) { return log(`审计载入失败：${e.message}`, true); }
  $("log").textContent =
    j.audit.map(a =>
      `${a.ts} ${a.actor} rev ${a.from_revision}→${a.to_revision} reason=${a.reason || "-"}` +
      `\n  before: ${(a.before || "").slice(0, 80)}`).join("\n") +
    `\n（最近 ${j.audit.length}/${j.total} 条）\n` + $("log").textContent;
}

// --- G4'（FR-211）：块历史 / 回滚 -------------------------------------------
// 数据面：GET /docs/<id>/audit?block_id=<bid>&limit=50。审计行 before/from_revision
// 与 edits.rollback 的取文口径一致：回滚到 N = 取 from_revision==N 那次的 before。
function historyRows(audit) {
  const seen = new Set();
  const out = [];
  (audit || []).forEach(a => {           // 服务端 rowid 升序（最旧在前）
    const rev = Number(a.from_revision);
    if (!Number.isInteger(rev) || rev < 1 || seen.has(rev)) return;
    seen.add(rev);
    out.push({ revision: rev, text: a.before || "", ts: a.ts || "",
               actor: a.actor || "", reason: a.reason || "" });
  });
  return out.reverse();                  // 最新可回滚版本在前
}

// 审计正文 / actor / reason 均可能来自源文档（不可信输入）：这里全程
// createElement + textContent 构造，不拼 innerHTML（G4' XSS 红线）。
async function showHistory(bid) {
  const el = blkEl(bid);
  if (!el) return log(`${bid} 不在已加载窗口内`, true);
  const box = el.querySelector("[data-hist]");
  if (!box) return;
  let j;
  try { j = await api(`/docs/${encodeURIComponent(VIEW.doc)}/audit?block_id=${encodeURIComponent(bid)}&limit=50`); }
  catch (e) { return log(`历史载入失败：${e.message}`, true); }
  const rows = historyRows(j.audit);
  box.textContent = "";
  const head = document.createElement("div");
  head.className = "meta";
  head.textContent = `可回滚版本 ${rows.length} 个（审计最近 ${j.audit.length}/${j.total} 条）`;
  box.appendChild(head);
  if (!rows.length) {
    const empty = document.createElement("div");
    empty.textContent = "暂无历史版本：该块尚未编辑过。";
    box.appendChild(empty);
  }
  rows.forEach(r => {
    const row = document.createElement("div");
    row.className = "histrow";
    const meta = document.createElement("div");
    meta.className = "meta";
    const rev = document.createElement("b");
    rev.textContent = `rev ${r.revision}`;
    const info = document.createElement("span");
    info.textContent = `${r.ts} ${r.actor || "-"} reason=${r.reason || "-"}`;
    meta.appendChild(rev);
    meta.appendChild(info);
    const prev = document.createElement("div");
    prev.className = "histprev";
    prev.textContent = r.text.slice(0, 120) + (r.text.length > 120 ? "…" : "");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "回滚到此版本";
    btn.onclick = () => rollbackTo(bid, r.revision, btn);
    row.appendChild(meta);
    row.appendChild(prev);
    row.appendChild(btn);
    box.appendChild(row);
  });
  box.hidden = false;
}

async function rollbackTo(bid, rev, btn) {
  btn.disabled = true;
  try {
    const r = await api(`/docs/${encodeURIComponent(VIEW.doc)}/blocks/${encodeURIComponent(bid)}/rollback`, {
      method: "POST",
      body: JSON.stringify({ to_revision: rev })
    });
    locked.set(bid, r.revision);
    log(`${bid} 已回滚到 rev ${rev} → 新 rev ${r.revision}（审计留痕 rollback_to_${rev}）`);
    await refetch(bid);
    await showHistory(bid);
  } catch (e) {
    log(`${bid} 回滚失败：${e.message}`, true);
  } finally {
    btn.disabled = false;
  }
}

async function doSearch(page) {
  const q = $("q").value.trim();
  document.querySelectorAll(".hit").forEach(e => e.classList.remove("hit"));
  if (!q) return;
  // CH-500（R17-API-7）：`/search` 现在收 `?offset=`。原先 `has_more=true` 只是
  // 一句「结果已截断」的死胡同——服务端不给翻页参数，GUI 只能让用户收窄查询。
  // 「更多命中」按上一页的 limit 前进；换了查询词或游标不明则回到第 0 页。
  const offset = (page === "more" && SRCH.q === q && SRCH.limit)
    ? SRCH.offset + SRCH.limit : 0;
  let j;
  try { j = await api(`/search?q=${encodeURIComponent(q)}&offset=${offset}`); }
  catch (e) { return log(`检索失败：${e.message}`, true); }
  SRCH = { q, offset: Number.isInteger(j.offset) ? j.offset : offset,
           limit: Number.isInteger(j.limit) ? j.limit : 0 };
  $("goMore").disabled = !j.has_more;
  // CH-498 / B-11 走查：`total` 是**本页**命中数（服务端截断时 has_more=true），
  // 原实现只报总数，用户看到「20 命中」会以为是全部。
  log(`检索「${q}」→ 本页 ${j.total} 命中（mode=${j.mode}，自第 ${SRCH.offset + 1} 条起）` +
      (j.has_more ? "，结果已截断（点「更多命中」取下一页，或收窄查询 / doc2md search --limit）" : ""));
  let off = 0, other = 0;
  (j.hits || []).forEach(h => {
    // /search 是跨文档的：其他文档的命中永远不会落在当前块窗口里，
    // 把它们计入「未载入窗口」等于让用户白点「加载更多」。
    if (h.doc_id && h.doc_id !== VIEW.doc) { other++; return; }
    const el = blkEl(h.block_id);
    if (el) el.querySelector("textarea").classList.add("hit");
    else off++;
  });
  if (off) log(`${off} 条命中在未载入的块窗口内（点「加载更多块」后重新检索）`, true);
  if (other) log(`${other} 条命中在其他文档（本页只高亮当前文档；doc2md search 可看全量）`, true);
}

$("blocks").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const bid = btn.closest(".blk").dataset.bid;
  ({ save: () => save(bid), refresh: () => refetch(bid), audit: () => showAudit(bid),
     history: () => showHistory(bid) })[btn.dataset.act]();
});
$("load").onclick = load;
$("more").onclick = loadMore;
$("go").onclick = doSearch;
$("goMore").onclick = () => doSearch("more");
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("onlyEdge").addEventListener("change", e => {
  document.querySelectorAll(".blk").forEach(el => {
    const isEdge = el.classList.contains("edge");
    if (e.target.checked && !isEdge) el.style.display = "none";
    else el.style.display = "";
  });
});

// T4：队列面板接线（首屏立即拉一次，之后按复选框 5s 自刷；填 Token 即触发一次）
$("qrefresh").onclick = loadQueue;
$("qauto").addEventListener("change", qAutoToggle);
$("tok").addEventListener("input", () => { if ($("tok").value.trim()) loadQueue(); });
loadQueue();
qAutoToggle();
</script>
